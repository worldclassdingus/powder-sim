<!doctype html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    
    <title>Ryan's Powder Sim</title>

    <link rel="stylesheet" href="style.css">

    <script src="main.js" defer></script>
</head>

<body>
    <h1>Powder Simulator</h1>

    <div class="toolbar">
        
        <button id="sandButton">Sand</button>
        <button id="waterButton">Water</button>
        <button id="wallButton">Wall</button>


        <button id="eraseButton">
            Erase
        </button>

        <button id="clearButton">
            Clear
        </button>

        <button id="stepButton">
            Step
        </button>

        <button id="runButton">
            Run
        </button>

        <p id="statusIndicator">
            Paused | Tick: 0 | Sand: 0
        </p>
    </div>

    <canvas
        id="canvas"
        width="160"
        height="120">
    </canvas>
    
</body>

</html>
